<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICRS - GOCC Reporting</title>
  <meta name="description" content="Interactive web interface for GOCC reporting, built with AlpineJS and Bootstrap 5." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ICRS - GOCC Reporting" />
  <meta property="og:description" content="Interactive web interface for GOCC reporting, built with AlpineJS and Bootstrap 5." />
  <meta property="og:image" content="./public/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/home.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="./index.html" aria-current="page">Home</a>
      <a href="./pages/auth/index.html">Auth Portal</a>
      <a href="./pages/dashboard/index.html">Dashboard</a>
    </nav>

    <header>
      <h1>ICRS - GOCC Reporting</h1>
      <p class="subtitle">Interactive web interface for GOCC reporting, built with AlpineJS and Bootstrap 5.</p>
    </header>

    <section class="card">
      <p class="muted">Sample pages, each with its own stylesheet:</p>
      <div class="hero-links">
        <a href="./pages/auth/index.html">Auth Portal — Sign In &amp; GOCC Registration</a>
        <a href="./pages/dashboard/index.html">Dashboard — no-service Alpine wiring check</a>
      </div>
    </section>

    <div class="toast-list" x-data x-show="$store.ui.toasts.length">
      <template x-for="toast in $store.ui.toasts" :key="toast.id">
        <div class="toast" x-text="toast.message"></div>
      </template>
    </div>
  </div>

  <script type="module" src="./src/core/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" crossorigin="anonymous"></script>

</html>
