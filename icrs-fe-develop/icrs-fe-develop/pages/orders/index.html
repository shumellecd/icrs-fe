<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Alpine FE Boilerplate</title>
  <meta name="description" content="Orders demo — backed by orderService, the example orders microservice client." />
  <meta name="theme-color" content="#0b0d12" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Orders — Alpine FE Boilerplate" />
  <meta property="og:description" content="Orders demo — backed by orderService, the example orders microservice client." />
  <meta property="og:image" content="../../public/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="../../public/favicon.svg" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../src/components/orderList/orderList.css" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="../../index.html">Home</a>
      <a href="../dashboard/index.html">Dashboard</a>
      <a href="../users/index.html">Users</a>
      <a href="./index.html" aria-current="page">Orders</a>
      <a href="../status/index.html">Status</a>
    </nav>

    <header>
      <h1>Orders</h1>
      <p class="subtitle">Backed by orderService → the orders microservice.</p>
    </header>

    <div class="card" x-data="orderList">
      <div class="card-body">
        <div class="d-flex align-items-center gap-2" x-show="loading">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <span>Loading...</span>
        </div>
        <div class="alert alert-danger mb-0" x-show="error" x-text="error"></div>
        <table class="table table-borderless mb-0" aria-label="Orders List Table" x-show="!loading && !error">
          <caption>List of recent orders</caption>
          <thead>
            <tr>
              <th scope="col">Order ID</th>
              <th scope="col" class="text-end">Total</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="order in orders" :key="order.id">
              <tr>
                <td x-text="order.id"></td>
                <td class="text-end" x-text="order.total"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/core/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
