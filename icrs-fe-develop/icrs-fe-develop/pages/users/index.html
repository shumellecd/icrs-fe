<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Alpine FE Boilerplate</title>
  <meta name="description" content="Users demo — backed by userService, the example users microservice client." />
  <meta name="theme-color" content="#0b0d12" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Users — Alpine FE Boilerplate" />
  <meta property="og:description" content="Users demo — backed by userService, the example users microservice client." />
  <meta property="og:image" content="../../public/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="../../public/favicon.svg" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../src/components/userList/userList.css" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="../../index.html">Home</a>
      <a href="../dashboard/index.html">Dashboard</a>
      <a href="./index.html" aria-current="page">Users</a>
      <a href="../orders/index.html">Orders</a>
      <a href="../status/index.html">Status</a>
    </nav>

    <header>
      <h1>Users</h1>
      <p class="subtitle">Backed by userService → the users microservice.</p>
    </header>

    <div class="card" x-data="userList">
      <div class="card-body">
        <div class="d-flex align-items-center gap-2" x-show="loading">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <span>Loading...</span>
        </div>
        <div class="alert alert-danger mb-0" x-show="error" x-text="error"></div>
        <ul class="list-group list-group-flush" x-show="!loading && !error">
          <template x-for="user in users" :key="user.id">
            <li class="list-group-item bg-transparent" x-text="user.name"></li>
          </template>
        </ul>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/core/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
