<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Alpine FE Boilerplate</title>
  <meta name="description" content="Counter demo — no service dependency, checks Alpine wiring in isolation." />
  <meta name="theme-color" content="#0b0d12" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dashboard — Alpine FE Boilerplate" />
  <meta property="og:description" content="Counter demo — no service dependency, checks Alpine wiring in isolation." />
  <meta property="og:image" content="../../public/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="../../public/favicon.svg" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../src/components/counter/counter.css" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="../../index.html">Home</a>
      <a href="./index.html" aria-current="page">Dashboard</a>
      <a href="../users/index.html">Users</a>
      <a href="../orders/index.html">Orders</a>
      <a href="../status/index.html">Status</a>
    </nav>

    <header>
      <h1>Dashboard</h1>
      <p class="subtitle">No service dependency — checks Alpine wiring in isolation.</p>
    </header>

    <div class="card" x-data="counter">
      <div class="card-body">
        <h6 class="card-subtitle mb-2 text-secondary">Counter</h6>
        <p class="display-4 mb-3" x-text="count"></p>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-primary" @click="decrement">-</button>
          <button type="button" class="btn btn-primary" @click="increment">+</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../../src/core/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
