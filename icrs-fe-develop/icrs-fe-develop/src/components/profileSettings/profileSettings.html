<!-- Profile Settings Component -->
<div x-data="profileSettings()" class="profile-settings-wrapper">
  <div class="card profile-card border-0 shadow-sm">
    
    <!-- Card Header -->
    <div class="profile-card-header px-4 py-3 d-flex align-items-center gap-2 border-bottom">
      <span class="material-icons profile-icon-primary">person_outline</span>
      <h5 class="mb-0 fw-bold profile-title-primary">My Profile</h5>
    </div>

    <!-- Card Body -->
    <div class="card-body p-4">
      
      <!-- Full Name -->
      <div class="mb-4">
        <label class="form-label profile-label fw-bold">Full Name</label>
        <input type="text" class="form-control profile-input" x-model="user.fullName">
      </div>

      <!-- Email Address -->
      <div class="mb-4">
        <label class="form-label profile-label fw-bold">Email Address</label>
        <input type="email" class="form-control profile-input" x-model="user.email">
      </div>

      <!-- Role (Read-only) -->
      <div class="mb-4">
        <label class="form-label profile-label fw-bold">Role</label>
        <input type="text" class="form-control profile-input-readonly" x-model="user.role" readonly>
      </div>

      <!-- Agency (Read-only) -->
      <div class="mb-4">
        <label class="form-label profile-label fw-bold">Agency</label>
        <input type="text" class="form-control profile-input-readonly" x-model="user.agency" readonly>
      </div>

      <!-- Save Button -->
      <button type="button" 
              class="btn profile-save-btn d-inline-flex align-items-center gap-2 mt-2" 
              @click="saveChanges()" 
              :disabled="isSaving">
        <span class="material-icons" style="font-size: 1.1rem;" x-text="isSaved ? 'check_circle_outline' : 'save'"></span>
        <span class="fw-bold" x-text="isSaved ? 'CHANGES SAVED' : 'SAVE CHANGES'"></span>
      </button>

    </div>
  </div>
</div>
